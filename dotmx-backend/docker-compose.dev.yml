version: "3.9"

# Development compose - lighter weight, with hot reload

services:
  # Kong API Gateway (Dev mode with declarative config)
  kong-dev:
    image: kong:3.5
    container_name: dotmx-kong-dev
    ports:
      - "8080:8000" # Proxy (HTTP) - main entry point (exposed as 8080)
      - "8001:8001" # Admin API
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.dev.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PLUGINS: bundled,prometheus,cors,rate-limiting,request-transformer,correlation-id
    volumes:
      - ./docker/kong.dev.yml:/etc/kong/kong.dev.yml:ro
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dotmx-dev
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nats:
    image: nats:2.10-alpine
    container_name: dotmx-nats-dev
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["--jetstream", "-m", "8222"]
    networks:
      - dotmx-dev

  postgres:
    image: postgres:16-alpine
    container_name: dotmx-postgres-dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: kowito
      POSTGRES_PASSWORD: "dotmx_dev_local"
      POSTGRES_INITDB_ARGS: "--auth-local=trust"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kowito"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - dotmx-dev

  redis:
    image: redis:7-alpine
    container_name: dotmx-redis-dev
    ports:
      - "6379:6379"
    networks:
      - dotmx-dev

networks:
  dotmx-dev:
    driver: bridge

volumes:
  postgres-data:
