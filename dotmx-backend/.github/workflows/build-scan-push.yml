  push_images:
    name: Push Images to Artifact Registry
    # run without scan gates for test flow
    needs: []
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            file: docker/Dockerfile.api
          - name: engine-ts
            file: docker/Dockerfile.engine
          - name: marketdata
            file: docker/Dockerfile.marketdata
          - name: engine-rust
            file: docker/Dockerfile.rust-engine
    steps:
      - uses: actions/checkout@v4

      - name: Auth to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Ensure Artifact Registry repo exists
        run: |
          set -e
          gcloud artifacts repositories describe "$REPOSITORY" --location="$REGION" \
            || gcloud artifacts repositories create "$REPOSITORY" \
                 --repository-format=docker \
                 --location="$REGION" \
                 --description="DotMX images"

      - name: Configure docker auth
        run: gcloud auth configure-docker $REG_HOST --quiet

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ env.REG_PATH }}/${{ matrix.name }}:${{ github.sha }}
            ${{ env.REG_PATH }}/${{ matrix.name }}:latest
            ${{ env.REG_PATH }}/${{ matrix.name }}:${{ github.ref_name }}
